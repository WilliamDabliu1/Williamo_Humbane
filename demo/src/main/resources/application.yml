spring:
  application:
    name: demo
  datasource:
    url: "jdbc:h2:file:./data/ditidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=MySQL"
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8081

logging:
  level:
    com.williamo: INFO

openmeteo:
  geocoding:
    url: https://geocoding-api.open-meteo.com/v1/search
    count: 10
    language: en
    format: json
  forecast:
    url: https://api.open-meteo.com/v1/forecast
    current: temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m
  connect-timeout-ms: 5000
  read-timeout-ms: 10000
